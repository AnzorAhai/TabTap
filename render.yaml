# Render Blueprint for the API. Frontends (guest app, admin panel) deploy on
# Vercel — see README.md "Deploy".
services:
  - type: web
    name: tabtap-api
    runtime: node
    plan: free
    # US East is the closest Render region to Venezuela. A region can only be
    # chosen when a service is created — see README.md for moving an existing one.
    region: virginia
    # --include=dev: NODE_ENV=production would otherwise skip the build tooling.
    # Node version comes from .nvmrc.
    buildCommand: npm ci --include=dev && npm run build --workspace=apps/api
    # Migrations run before every start; already-applied files are skipped.
    startCommand: node db/migrate.mjs && node apps/api/dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      # Comma-separated frontend origins, e.g. https://tabtap-guest.vercel.app,https://tabtap-admin.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # Guest app base URL, used for the table QR links shown in the admin panel.
      - key: GUEST_APP_URL
        sync: false
      - key: POS_CONNECTOR_TYPE
        value: mock
      - key: PAYMENT_PROVIDER_TYPE
        value: mock
