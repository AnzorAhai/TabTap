services:
  - type: web
    name: tabtap-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build --workspace=packages/shared && npm run build --workspace=apps/api
    startCommand: node apps/api/dist/main.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: POS_CONNECTOR_TYPE
        value: mock
      - key: PAYMENT_PROVIDER_TYPE
        value: mock
      - key: GUEST_APP_URL
        sync: false
