# Local Postgres for development. Schema and demo data are applied with
# `npm run db:migrate` (the same script every deploy runs), not by the container.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tabtap
      POSTGRES_PASSWORD: tabtap
      POSTGRES_DB: tabtap
    ports:
      - "5432:5432"
    volumes:
      - tabtap_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tabtap"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tabtap_postgres_data:
